[project]
name = "cantuccio"
version = "0.3.0"
description = "The sweetest corner plot package around."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.10.9",
    "scipy>=1.17.1",
    "kdepy>=1.1.12",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "mypy>=2.0.0",
]
docs = [
    "ipython>=8.18.0",  # provides the ipython3 Pygments lexer for tutorial notebook cells
    "marimo>=0.23.5",
    "myst-parser>=5.1.0",
    "nbsphinx>=0.9.8",
    "sphinx>=8.5.0",
    "sphinx-autodoc-typehints>=3.10.2",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"cantuccio" = ["mplfiles/*.mplstyle"]
